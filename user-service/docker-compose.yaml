# docker-compose.yaml

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
    - "5432:5432"
    volumes:
    - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d userdb"]
      interval: 5s
      timeout: 3s
      retries: 10


  user-service:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: userdb
      DB_USER: user
      DB_PASS: password
      SERVER_PORT: 8080
    ports:
    - "8080:8080"
    depends_on:
      db:
        condition: service_healthy


volumes:
  pgdata: