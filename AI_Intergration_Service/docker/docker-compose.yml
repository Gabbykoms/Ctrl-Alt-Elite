version: '3.8'

services:
  # Trinity AI Service
  ai-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: trinity-ai-service
    environment:
      # Service Configuration
      AI_SERVICE_NAME: trinity-ai-service
      AI_SERVICE_PORT: 8083
      AI_ENVIRONMENT: ${AI_ENVIRONMENT:-production}
      AI_LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}

      # Supabase Database 
      AI_DATABASE_URL: ${AI_DATABASE_URL}
      
      # Or construct from Supabase connection details
      # AI_DATABASE_URL: postgresql://postgres:[YOUR-PASSWORD]@db.[PROJECT-REF].supabase.co:5432/postgres

      # OpenAI
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY}

      # LangChain Models
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-4o-mini}

      # Generation Parameters
      MAX_TOKENS: ${MAX_TOKENS:-500}
      TEMPERATURE: ${TEMPERATURE:-0.7}

      # RAG Settings
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.5}
      MAX_CONTEXT_DOCUMENTS: ${MAX_CONTEXT_DOCUMENTS:-5}
      VECTOR_DIMENSION: ${VECTOR_DIMENSION:-1536}

      # External Services
      TRACKING_SERVICE_URL: ${TRACKING_SERVICE_URL:-http://tracking-service:8082/api/tracking}

      # RabbitMQ Configuration
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_CHAT_REQUESTS_QUEUE: ${RABBITMQ_CHAT_REQUESTS_QUEUE:-chat.requests}
      RABBITMQ_CHAT_RESPONSES_QUEUE: ${RABBITMQ_CHAT_RESPONSES_QUEUE:-chat.responses}

      # CORS
      AI_ALLOWED_ORIGINS: ${AI_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}

      # Supabase
      AI_SUPABASE_URL: ${AI_SUPABASE_URL}
      AI_SUPABASE_KEY: ${AI_SUPABASE_KEY}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}

    ports:
      - "8083:8083"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - trinity-network
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: trinity-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
    networks:
      - trinity-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  trinity-network:
    driver: bridge

volumes:
  rabbitmq_data:
  rabbitmq_logs: