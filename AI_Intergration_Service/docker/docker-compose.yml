version: '3.8'

services:
  # PostgreSQL database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: trinity-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-trinity_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trinity_password}
      POSTGRES_DB: ${DB_NAME:-trinity_shuttle_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trinity_user} -d ${DB_NAME:-trinity_shuttle_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trinity-network
    restart: unless-stopped

  # Trinity AI Service
  ai-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: trinity-ai-service
    environment:
      # Service Configuration
      SERVICE_NAME: trinity-ai-service
      SERVICE_PORT: 8083
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Database
      DATABASE_URL: postgresql://${DB_USER:-trinity_user}:${DB_PASSWORD:-trinity_password}@postgres:5432/${DB_NAME:-trinity_shuttle_db}

      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      # LangChain Models
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-4o-mini}

      # Generation Parameters
      MAX_TOKENS: ${MAX_TOKENS:-500}
      TEMPERATURE: ${TEMPERATURE:-0.7}

      # RAG Settings
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.5}
      MAX_CONTEXT_DOCUMENTS: ${MAX_CONTEXT_DOCUMENTS:-5}
      VECTOR_DIMENSION: ${VECTOR_DIMENSION:-1536}

      # External Services
      TRACKING_SERVICE_URL: ${TRACKING_SERVICE_URL:-http://tracking-service:8082/api/tracking}

      # CORS
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}

      # Optional
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}

    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - trinity-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local

networks:
  trinity-network:
    driver: bridge
