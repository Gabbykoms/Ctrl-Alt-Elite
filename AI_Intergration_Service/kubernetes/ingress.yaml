apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trinity-ai-ingress
  namespace: trinity
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - trinity-ai.example.com
    secretName: trinity-ai-tls
  rules:
  - host: trinity-ai.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: trinity-ai-service
            port:
              number: 8083
