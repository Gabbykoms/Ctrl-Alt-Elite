apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: elite-dev

resources:
  - namespace.yaml
  - secret.yaml
  - configmap.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml

commonLabels:
  app.kubernetes.io/name: bantam-ai-service
  app.kubernetes.io/version: v1
  app.kubernetes.io/managed-by: kustomize

images:
- name: ai-service
  newName: harbor.javajon-gke.duckdns.org/library/elite-ai-service
  newTag: latest

commonAnnotations:
  company: trinity
  project: shuttle
