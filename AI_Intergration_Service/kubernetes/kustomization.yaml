apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: trinity

resources:
  - namespace.yaml
  - secret.yaml
  - configmap.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml

commonLabels:
  app.kubernetes.io/name: trinity-ai-service
  app.kubernetes.io/version: v1
  app.kubernetes.io/managed-by: kustomize

images:
- name: ghcr.io/gabbykoms/trinity-ai-service
  newTag: latest

commonAnnotations:
  company: trinity
  project: shuttle
