apiVersion: apps/v1
kind: Deployment
metadata:
  name: bantam-ai-service
  namespace: elite-dev
  labels:
    app: bantam-ai-service
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: bantam-ai-service
  template:
    metadata:
      labels:
        app: bantam-ai-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: bantam-ai-service
      imagePullSecrets:
      - name: harbor-pull-secret
      containers:
      - name: ai-service
        image: harbor.javajon-gke.duckdns.org/library/elite-ai-service:latest
        imagePullPolicy: Always
        
        ports:
        - name: http
          containerPort: 8083
          protocol: TCP
        
        envFrom:
        - configMapRef:
            name: bantam-ai-config
        - secretRef:
            name: bantam-ai-secret
        
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      
      volumes:
      - name: logs
        emptyDir: {}
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - bantam-ai-service
              topologyKey: kubernetes.io/hostname
      
      terminationGracePeriodSeconds: 30
