apiVersion: v1
kind: ConfigMap
metadata:
  name: trinity-ai-config
  namespace: trinity
data:
  SERVICE_NAME: "trinity-ai-service"
  SERVICE_PORT: "8083"
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  EMBEDDING_MODEL: "text-embedding-3-small"
  CHAT_MODEL: "gpt-4o-mini"
  MAX_TOKENS: "500"
  TEMPERATURE: "0.7"
  SIMILARITY_THRESHOLD: "0.5"
  MAX_CONTEXT_DOCUMENTS: "5"
  VECTOR_DIMENSION: "1536"
  TRACKING_SERVICE_URL: "http://tracking-service:8082/api/tracking"
  ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173,https://trinity.example.com"
  OPENWEATHER_API_KEY: ""
