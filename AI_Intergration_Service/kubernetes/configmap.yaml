apiVersion: v1
kind: ConfigMap
metadata:
  name: bantam-ai-config
  namespace: elite-dev
data:
  AI_SERVICE_NAME: "bantam-ai-service"
  AI_SERVICE_PORT: "8083"
  AI_ENVIRONMENT: "production"
  AI_LOG_LEVEL: "INFO"
  EMBEDDING_MODEL: "text-embedding-3-small"
  CHAT_MODEL: "gpt-4o-mini"
  MAX_TOKENS: "500"
  TEMPERATURE: "0.7"
  SIMILARITY_THRESHOLD: "0.5"
  MAX_CONTEXT_DOCUMENTS: "5"
  VECTOR_DIMENSION: "1536"
  TRACKING_SERVICE_URL: "http://tracking-service:8081/api/tracking"
  AI_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:8080,http://localhost:8083"
  # RabbitMQ Configuration
  RABBITMQ_HOST: "rabbitmq-service"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: "guest"
  RABBITMQ_VHOST: "/"
  RABBITMQ_SHUTTLE_UPDATES_QUEUE: "shuttle.updates"
  RABBITMQ_SHUTTLE_ALERTS_QUEUE: "shuttle.alerts"
  RABBITMQ_LOCATION_EXCHANGE: "shuttle.location.exchange"
  RABBITMQ_LOCATION_ROUTING_KEY: "location.update"
  DB_USER: "postgres"
  DB_NAME: "postgres"
  INGEST_KB: "true"
