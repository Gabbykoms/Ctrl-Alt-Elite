apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bantam-shuttle-ingress
  namespace: elite-dev
  annotations:
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://shuttle.javajon-gke.duckdns.org, http://localhost:5173"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/websocket-services: "bantam-shuttle-backend"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
  - host: shuttle.javajon-gke.duckdns.org
    http:
      paths:
      # Backend API Routes
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: bantam-shuttle-backend
            port:
              number: 8080
      - path: /api/shuttles
        pathType: Prefix
        backend:
          service:
            name: bantam-shuttle-backend
            port:
              number: 8080
      - path: /api/routes
        pathType: Prefix
        backend:
          service:
            name: bantam-shuttle-backend
            port:
              number: 8080
      - path: /api/stops
        pathType: Prefix
        backend:
          service:
            name: bantam-shuttle-backend
            port:
              number: 8080
      - path: /api/rides
        pathType: Prefix
        backend:
          service:
            name: bantam-shuttle-backend
            port:
              number: 8080
      - path: /api/drivers
        pathType: Prefix
        backend:
          service:
            name: bantam-shuttle-backend
            port:
              number: 8080
      - path: /api-docs
        pathType: Prefix
        backend:
          service:
            name: bantam-shuttle-backend
            port:
              number: 8080
      # Socket.io WebSocket
      - path: /socket.io
        pathType: ImplementationSpecific
        backend:
          service:
            name: bantam-shuttle-backend
            port:
              number: 8080
      # Tracking Service Routes
      - path: /api/tracking
        pathType: Prefix
        backend:
          service:
            name: bantam-shuttle-tracking
            port:
              number: 8081
      - path: /swagger-ui
        pathType: Prefix
        backend:
          service:
            name: bantam-shuttle-tracking
            port:
              number: 8081
      - path: /v1/drivers
        pathType: Prefix
        backend:
          service:
            name: bantam-shuttle-tracking
            port:
              number: 8081
      - path: /v1/rides
        pathType: Prefix
        backend:
          service:
            name: bantam-shuttle-tracking
            port:
              number: 8081
      - path: /v1/stops
        pathType: Prefix
        backend:
          service:
            name: bantam-shuttle-tracking
            port:
              number: 8081
      - path: /v1/locations
        pathType: Prefix
        backend:
          service:
            name: bantam-shuttle-tracking
            port:
              number: 8081
      - path: /v1/routes
        pathType: Prefix
        backend:
          service:
            name: bantam-shuttle-tracking
            port:
              number: 8081
      - path: /actuator
        pathType: Prefix
        backend:
          service:
            name: bantam-shuttle-tracking
            port:
              number: 8081
      - path: /health/tracking
        pathType: Exact
        backend:
          service:
            name: bantam-shuttle-tracking
            port:
              number: 8081
      # AI Service Routes
      - path: /api/ai
        pathType: Prefix
        backend:
          service:
            name: bantam-ai-service
            port:
              number: 8083
      - path: /chat
        pathType: Prefix
        backend:
          service:
            name: bantam-ai-service
            port:
              number: 8083
      - path: /documents
        pathType: Prefix
        backend:
          service:
            name: bantam-ai-service
            port:
              number: 8083
      - path: /health/ai
        pathType: Exact
        backend:
          service:
            name: bantam-ai-service
            port:
              number: 8083
      # Backend Health Check
      - path: /health/backend
        pathType: Exact
        backend:
          service:
            name: bantam-shuttle-backend
            port:
              number: 8080
      # Frontend (catch-all) - must be last
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bantam-shuttle-frontend
            port:
              number: 80
