version: '3.8'

services:
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ctrl-alt-elite-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - ./tailwind.config.js:/app/tailwind.config.js
      - ./postcss.config.js:/app/postcss.config.js
      - ./tsconfig.json:/app/tsconfig.json
      - ./.env:/app/.env
    environment:
      - NODE_ENV=development
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ctrl-alt-elite-network

  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://backend:8080/api}
        - VITE_SOCKET_URL=${VITE_SOCKET_URL:-http://backend:8080}
        - VITE_AI_SERVICE_URL=${VITE_AI_SERVICE_URL:-http://ai-service:8083}
    container_name: ctrl-alt-elite-frontend-prod
    ports:
      - "80:80"
    networks:
      - ctrl-alt-elite-network
    profiles:
      - production

networks:
  ctrl-alt-elite-network:
    driver: bridge
