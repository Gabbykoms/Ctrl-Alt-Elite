version: '3.8'

services:
  backend:
    image: your-backend-image:latest
    container_name: ctrl-alt-elite-backend
    ports:
      - "8080:8080"
    networks:
      - ctrl-alt-elite-network
    environment:
      - NODE_ENV=production
      # Add your backend env vars here

  ai-service:
    image: your-ai-service-image:latest
    container_name: ctrl-alt-elite-ai-service
    ports:
      - "8083:8083"
    networks:
      - ctrl-alt-elite-network
    environment:
      - NODE_ENV=production
      # Add your AI service env vars here

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://backend:8080/api
        - VITE_SOCKET_URL=http://backend:8080
        - VITE_AI_SERVICE_URL=http://ai-service:8083
        - VITE_MAPBOX_TOKEN=${VITE_MAPBOX_TOKEN}
    container_name: ctrl-alt-elite-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
      - ai-service
    networks:
      - ctrl-alt-elite-network

networks:
  ctrl-alt-elite-network:
    driver: bridge
