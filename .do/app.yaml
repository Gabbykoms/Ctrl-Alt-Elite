name: bantam-shuttle
region: nyc
services:
  - name: backend
    github:
      repo: Trinity-Shuttle-Service/Ctrl-Alt-Elite
      branch: version2
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /api
      - path: /health
      - path: /socket.io
    health_check:
      http_path: /health
      initial_delay_seconds: 40
      period_seconds: 30
      timeout_seconds: 10
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: FRONTEND_URL
        value: ${APP_URL}
      - key: SUPABASE_URL
        value: ${SUPABASE_URL}
        type: SECRET
      - key: SUPABASE_ANON_KEY
        value: ${SUPABASE_ANON_KEY}
        type: SECRET
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: ${SUPABASE_SERVICE_ROLE_KEY}
        type: SECRET
      - key: JWT_SECRET
        value: ${JWT_SECRET}
        type: SECRET
      - key: SENDGRID_API_KEY
        value: ${SENDGRID_API_KEY}
        type: SECRET
      - key: TRACKING_SERVICE_URL
        value: ${tracking-service.PRIVATE_URL}/api/tracking
      - key: AI_SERVICE_URL
        value: ${ai-service.PRIVATE_URL}/api/ai

  - name: tracking-service
    github:
      repo: Trinity-Shuttle-Service/Ctrl-Alt-Elite
      branch: version2
      deploy_on_push: true
    source_dir: tracking-service
    dockerfile_path: Dockerfile
    http_port: 8081
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /tracking
    health_check:
      http_path: /actuator/health
      initial_delay_seconds: 40
      period_seconds: 30
      timeout_seconds: 10
      failure_threshold: 3
    envs:
      - key: TRACKING_DB_URL
        value: ${TRACKING_DB_URL}
        type: SECRET
      - key: DB_USER
        value: ${TRACKING_DB_USER}
        type: SECRET
      - key: DB_PASSWORD
        value: ${TRACKING_DB_PASSWORD}
        type: SECRET
      - key: SPRING_PROFILES_ACTIVE
        value: production

  - name: ai-service
    github:
      repo: Trinity-Shuttle-Service/Ctrl-Alt-Elite
      branch: version2
      deploy_on_push: true
    source_dir: AI_Intergration_Service
    dockerfile_path: docker/Dockerfile
    http_port: 8083
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /ai
    health_check:
      http_path: /health
      initial_delay_seconds: 40
      period_seconds: 30
      timeout_seconds: 10
      failure_threshold: 3
    envs:
      - key: AI_OPENAI_API_KEY
        value: ${AI_OPENAI_API_KEY}
        type: SECRET
      - key: AI_DATABASE_URL
        value: ${AI_DATABASE_URL}
        type: SECRET
      - key: AI_SUPABASE_URL
        value: ${AI_SUPABASE_URL}
        type: SECRET
      - key: AI_SUPABASE_KEY
        value: ${AI_SUPABASE_KEY}
        type: SECRET
      - key: OPENWEATHER_API_KEY
        value: ${OPENWEATHER_API_KEY}
        type: SECRET
      - key: TRACKING_SERVICE_URL
        value: ${tracking-service.PRIVATE_URL}/api/tracking
      - key: AI_ALLOWED_ORIGINS
        value: ${APP_URL}
      - key: AI_ENVIRONMENT
        value: production

services:
  - name: frontend
    github:
      repo: Trinity-Shuttle-Service/Ctrl-Alt-Elite
      branch: version2
      deploy_on_push: true
    source_dir: frontend
    dockerfile_path: Dockerfile
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    health_check:
      http_path: /
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 10
      failure_threshold: 3
    envs:
      - key: VITE_API_BASE_URL
        value: ${APP_URL}/api
      - key: VITE_SOCKET_URL
        value: ${APP_URL}
      - key: VITE_AI_SERVICE_URL
        value: ${APP_URL}/ai
      - key: VITE_TRACKING_SERVICE_URL
        value: ${APP_URL}/tracking
      - key: VITE_MAPBOX_TOKEN
        value: ${VITE_MAPBOX_TOKEN}
        type: SECRET
