name: Tracking Service CI/CD

on:
  push:
    branches:
      - main
      - tracking
    paths:
      - 'tracking-service/**'
      - '.github/workflows/tracking-ci-cd.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tracking-service/**'
  workflow_dispatch:

env:
  HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
  IMAGE_NAME: elite-tracking-service
  VERSION: v1.0.0  # Update this for major releases

jobs:
  # Job 1: Test and Build
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tracking-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run checks and tests
        run: ./gradlew check --no-daemon

      - name: Build application
        run: ./gradlew build --no-daemon

  # Job 2: Build and Push Docker Image
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Generate tags
        id: tags
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d-%H%M")
          echo "timestamp=v${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "version=${{ env.VERSION }}" >> $GITHUB_OUTPUT
          echo "sha=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./tracking-service
          file: ./tracking-service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.HARBOR_REGISTRY }}/library/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.version }}
            ${{ env.HARBOR_REGISTRY }}/library/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.timestamp }}
            ${{ env.HARBOR_REGISTRY }}/library/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.tags.outputs.timestamp }}

      - name: Image digest
        run: echo "Image pushed with tags - Version:${{ steps.tags.outputs.version }}, Timestamp:${{ steps.tags.outputs.timestamp }}, SHA:${{ steps.tags.outputs.sha }}"
