name: Frontend PR Checks

on:
  pull_request:
    branches:
      - main
      - frontend
    paths:
      - 'frontend/**'

jobs:
  pr-checks:
    name: PR Quality Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build check
        run: npm run build
        env:
          VITE_API_BASE_URL: http://backend:8080/api
          VITE_SOCKET_URL: http://backend:8080
          VITE_AI_SERVICE_URL: http://ai-service:8083

      - name: Check bundle size
        run: |
          npm run build
          echo "### Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          du -sh dist/* | sort -h >> $GITHUB_STEP_SUMMARY || true

      - name: PR Summary
        run: |
          echo " All checks passed for PR #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ github.head_ref }}" >> $GITHUB_STEP_SUMMARY
