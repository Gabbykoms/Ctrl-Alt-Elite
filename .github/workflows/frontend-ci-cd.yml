name: Frontend CI/CD

on:
  push:
    branches:
      - main
      - frontend
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci-cd.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:

env:
  HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
  IMAGE_NAME: elite-frontend
  VERSION: v5.0.3  # Update this for major releases

jobs:
  # Job 1: Lint and Test
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint --if-present || echo "No lint script found"

      - name: Run tests
        run: npm run test --if-present || echo "No test script found"

      - name: Build check
        run: npm run build
        env:
          VITE_API_BASE_URL: https://shuttle.javajon-gke.duckdns.org/api
          VITE_SOCKET_URL: https://shuttle.javajon-gke.duckdns.org
