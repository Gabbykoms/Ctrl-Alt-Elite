name: Tracking Service CI

on:
  push:
    branches:
      - main
      - tracking-service
    paths:
      - 'tracking-service/**'
      - '.github/workflows/tracking-service-ci.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'tracking-service/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tracking_db
          POSTGRES_USER: tracking_user
          POSTGRES_PASSWORD: tracking_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build with Gradle
        run: |
          cd tracking-service
          ./gradlew clean build -x test

      - name: Build Docker image
        run: |
          cd tracking-service
          ./gradlew bootBuildImage

      - name: Run container and wait for startup
        run: |
          docker run -d \
            --name tracking-app \
            --network host \
            -e SPRING_DATASOURCE_URL="jdbc:postgresql://localhost:5432/tracking_db" \
            -e SPRING_DATASOURCE_USERNAME="tracking_user" \
            -e SPRING_DATASOURCE_PASSWORD="tracking_password" \
            -e SPRING_DATA_REDIS_HOST="localhost" \
            -e SPRING_DATA_REDIS_PORT="6379" \
            -e SPRING_DATA_REDIS_PASSWORD="redis_password" \
            tracking-service:0.1.0
          
          # Wait for container to be ready
          sleep 15

      - name: Health check - Test if container is alive
        run: |
          # Try to reach the health endpoint
          for i in {1..30}; do
            if curl -f http://localhost:8081/actuator/health; then
              echo "✅ Service is healthy"
              exit 0
            fi
            echo "Attempt $i/30 - Waiting for service to be ready..."
            sleep 2
          done
          echo "❌ Service failed to become healthy"
          docker logs tracking-app
          exit 1

      - name: Test API endpoints
        run: |
          BASE_URL="http://localhost:8081"
          
          # Test 1: Create a driver first
          echo "🧪 Test 1: Creating a driver..."
          DRIVER_RESPONSE=$(curl -s -X POST $BASE_URL/v1/drivers \
            -H "Content-Type: application/json" \
            -d '{
              "id":"ci-test-driver-'$(date +%s)'",
              "name":"CI Test Driver",
              "phoneNumber":"5551234567",
              "shuttleId":"shuttle-1"
            }')
          echo "Response: $DRIVER_RESPONSE"
          
          # Test 2: GET /v1/drivers with retry
          echo -e "\n🧪 Test 2: Getting drivers..."
          for i in {1..5}; do
            DRIVERS=$(curl -s -f $BASE_URL/v1/drivers)
            if [ $? -eq 0 ]; then
              echo "✅ GET /v1/drivers successful"
              echo "Response (first 150 chars): $(echo $DRIVERS | head -c 150)"
              break
            fi
            if [ $i -lt 5 ]; then
              echo "Attempt $i/5 failed, retrying..."
              sleep 2
            else
              echo "❌ GET /v1/drivers failed after 5 attempts"
              exit 1
            fi
          done
          
          # Test 3: GET /v1/stops with retry
          echo -e "\n🧪 Test 3: Getting stops (pre-seeded data)..."
          for i in {1..5}; do
            STOPS=$(curl -s -f $BASE_URL/v1/stops)
            if [ $? -eq 0 ]; then
              echo "✅ GET /v1/stops successful"
              echo "Response (first 150 chars): $(echo $STOPS | head -c 150)"
              break
            fi
            if [ $i -lt 5 ]; then
              echo "Attempt $i/5 failed, retrying..."
              sleep 2
            else
              echo "❌ GET /v1/stops failed after 5 attempts"
              exit 1
            fi
          done
          
          echo -e "\n✅ All API tests passed"

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Container Logs ==="
          docker logs tracking-app || true
          echo "=== Running Containers ==="
          docker ps -a || true

      - name: Cleanup
        if: always()
        run: |
          docker stop tracking-app || true
          docker rm tracking-app || true
