apiVersion: v1
kind: Service
metadata:
  name: bantam-shuttle-backend
  labels:
    app: bantam-shuttle-backend
    tier: backend
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: bantam-shuttle-backend
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
---
apiVersion: v1
kind: Service
metadata:
  name: bantam-shuttle-backend-lb
  labels:
    app: bantam-shuttle-backend
    tier: backend
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  selector:
    app: bantam-shuttle-backend
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
