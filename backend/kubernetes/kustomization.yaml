apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bantam-shuttle

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - hpa.yaml
  - ingress.yaml

commonLabels:
  app.kubernetes.io/name: bantam-shuttle-backend
  app.kubernetes.io/part-of: bantam-shuttle
  app.kubernetes.io/managed-by: kustomize

images:
  - name: bantam-shuttle-backend
    newName: your-registry/bantam-shuttle-backend
    newTag: latest
