apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bantam-shuttle-backend-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/websocket-services: "bantam-shuttle-backend"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  tls:
  - hosts:
    - api.bantam-shuttle.example.com
    secretName: bantam-backend-tls
  rules:
  - host: api.bantam-shuttle.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bantam-shuttle-backend
            port:
              number: 8080
