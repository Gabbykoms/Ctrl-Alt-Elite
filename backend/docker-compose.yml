version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: bantam-shuttle-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - TRACKING_SERVICE_URL=${TRACKING_SERVICE_URL:-http://tracking-service:8080}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai-service:8083}
    networks:
      - bantam-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.bantam.service=backend"
      - "com.bantam.team=ctrl-alt-elite"

networks:
  bantam-network:
    driver: bridge
    name: bantam-network
