apiVersion: v1
kind: ConfigMap
metadata:
  name: bantam-ai-config
  namespace: elite-dev
  labels:
    app: bantam-ai-service
data:
  AI_SERVICE_NAME: "bantam-ai-service"
  AI_SERVICE_PORT: "8083"
  AI_ENVIRONMENT: "production"
  AI_LOG_LEVEL: "INFO"
  EMBEDDING_MODEL: "text-embedding-3-small"
  CHAT_MODEL: "gpt-4o-mini"
  MAX_TOKENS: "500"
  TEMPERATURE: "0.7"
  SIMILARITY_THRESHOLD: "0.5"
  MAX_CONTEXT_DOCUMENTS: "5"
  VECTOR_DIMENSION: "1536"
  TRACKING_SERVICE_URL: "http://bantam-shuttle-tracking.elite-dev.svc.cluster.local:8081/api/tracking"
  AI_ALLOWED_ORIGINS: "http://bantam-shuttle.duckdns.org,http://localhost:5173,http://localhost:8080"
  RABBITMQ_HOST: "rabbitmq-service"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: "guest"
  RABBITMQ_VHOST: "/"
  RABBITMQ_CHAT_REQUESTS_QUEUE: "chat.requests"
  RABBITMQ_CHAT_RESPONSES_QUEUE: "chat.responses"
  INGEST_KB: "false"
