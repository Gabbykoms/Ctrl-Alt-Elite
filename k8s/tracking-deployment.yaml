apiVersion: apps/v1
kind: Deployment
metadata:
  name: bantam-shuttle-tracking
  namespace: elite-dev
  labels:
    app: bantam-shuttle-tracking
    tier: backend
    team: ctrl-alt-elite
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: bantam-shuttle-tracking
  template:
    metadata:
      labels:
        app: bantam-shuttle-tracking
        tier: backend
        team: ctrl-alt-elite
    spec:
      imagePullSecrets:
      - name: bantam-shuttle-registry
      containers:
      - name: bantam-shuttle-tracking
        image: registry.digitalocean.com/bantam-shuttle-registry/tracking-service:2.0.2
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8081
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "docker"
        - name: SERVER_PORT
          value: "8081"
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: bantam-secrets
              key: supabase-url
        - name: SUPABASE_ANON_KEY
          valueFrom:
            secretKeyRef:
              name: bantam-secrets
              key: supabase-anon-key
        - name: SUPABASE_SERVICE_ROLE_KEY
          valueFrom:
            secretKeyRef:
              name: bantam-secrets
              key: supabase-service-role-key
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      restartPolicy: Always
