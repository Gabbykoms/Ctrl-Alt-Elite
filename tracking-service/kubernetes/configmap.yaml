apiVersion: v1
kind: ConfigMap
metadata:
  name: tracking-config
  namespace: bantam-shuttle
data:
  # Database configuration
  db-host: "tracking-postgres"
  db-port: "5432"
  db-name: "tracking_db"
  
  # Redis configuration
  redis-host: "tracking-redis"
  redis-port: "6379"
  
  # Application configuration
  server-port: "8081"
