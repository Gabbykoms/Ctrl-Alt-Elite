apiVersion: v1
kind: ConfigMap
metadata:
  name: tracking-config
  namespace: elite-dev
data:
  # Database configuration - using existing postgres from elite-db namespace
  db-host: "my-postgresql.elite-db.svc.cluster.local"
  db-port: "5432"
  db-name: "tracking_db"
  
  # Redis configuration - using existing redis from elite-db namespace
  redis-host: "my-redis-master.elite-db.svc.cluster.local"
  redis-port: "6379"
  
  # Application configuration
  server-port: "8081"
