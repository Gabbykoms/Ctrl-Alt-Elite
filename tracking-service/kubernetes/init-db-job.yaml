apiVersion: batch/v1
kind: Job
metadata:
  name: tracking-db-init
  namespace: elite-db
spec:
  backoffLimit: 3
  template:
    metadata:
      name: tracking-db-init
    spec:
      serviceAccountName: default
      containers:
      - name: init-db
        image: postgres:16-alpine
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: tracking-secrets # name of secret containing the password
              key: postgres-password # key in the secret that holds the password
        - name: PGHOST
          valueFrom:
            secretKeyRef:
              name: tracking-secrets # name of secret containing the host
              key: postgres-host # key in the secret that holds the host
        - name: PGPORT
          valueFrom:
            secretKeyRef:
              name: tracking-secrets # name of secret containing the port
              key: postgres-port # key in the secret that holds the port
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: tracking-secrets # name of secret containing the username
              key: postgres-user # key in the secret that holds the username
        - name: PGDATABASE
          valueFrom:
            secretKeyRef:
              name: tracking-secrets # name of secret containing the database name
              key: postgres-database # key in the secret that holds the database name
        command:
        - sh
        - -c
        - |
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if pg_isready -h $PGHOST -p $PGPORT; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Attempt $i/30: PostgreSQL not ready yet, waiting..."
            sleep 2
          done
          
          echo "Running database initialization..."
          psql -h $PGHOST -p $PGPORT -U $PGUSER -d $PGDATABASE -f /scripts/init_db.sql
          
          if [ $? -eq 0 ]; then
            echo "✅ Database initialization completed successfully"
          else
            echo "❌ Database initialization failed"
            exit 1
          fi
        volumeMounts:
        - name: init-script
          mountPath: /scripts
      volumes:
      - name: init-script
        configMap:
          name: tracking-init-db-script
      restartPolicy: Never
