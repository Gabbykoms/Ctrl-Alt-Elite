apiVersion: v1
kind: Service
metadata:
  name: tracking-postgres
  namespace: bantam-shuttle
  labels:
    app: tracking-postgres
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  selector:
    app: tracking-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tracking-postgres
  namespace: bantam-shuttle
spec:
  serviceName: tracking-postgres
  replicas: 1
  selector:
    matchLabels:
      app: tracking-postgres
  template:
    metadata:
      labels:
        app: tracking-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: "tracking_db"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: tracking-secrets
              key: db-username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tracking-secrets
              key: db-password
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tracking-redis
  namespace: bantam-shuttle
  labels:
    app: tracking-redis
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  selector:
    app: tracking-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-redis
  namespace: bantam-shuttle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tracking-redis
  template:
    metadata:
      labels:
        app: tracking-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
