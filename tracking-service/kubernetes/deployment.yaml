apiVersion: apps/v1
kind: Deployment
metadata:
  name: bantam-shuttle-tracking
  namespace: elite-dev
  labels:
    app: bantam-shuttle-tracking
    tier: backend
    team: ctrl-alt-elite
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: bantam-shuttle-tracking
  template:
    metadata:
      labels:
        app: bantam-shuttle-tracking
        tier: backend
        team: ctrl-alt-elite
    spec:
      containers:
      - name: tracking
        image: harbor.javajon-gke.duckdns.org/library/elite-tracking-service:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8081
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: SERVER_PORT
          value: "8081"
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: tracking-config
              key: db-host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: tracking-config
              key: db-port
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: tracking-config
              key: db-name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: tracking-secrets
              key: db-username
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: tracking-secrets
              key: db-username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tracking-secrets
              key: db-password
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: tracking-config
              key: redis-host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: tracking-config
              key: redis-port
        - name: REDIS_USERNAME
          value: "default"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: my-redis
              key: redis-password
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
