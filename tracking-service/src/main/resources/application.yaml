# src/main/resources/application.yml
spring:
  application:
    name: tracking-service
  
  # Redis configuration for persistent location storage
  # Optional: comment out to use in-memory storage instead
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  
  # rabbitmq:
  #   host: ${RABBITMQ_HOST:localhost}
