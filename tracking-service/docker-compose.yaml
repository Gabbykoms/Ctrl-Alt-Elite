# docker-compose.yml (local dev)
services:
  rabbit:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]
  tracking:
    build: .
    environment:
      RABBITMQ_HOST: rabbit
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
    ports: ["8080:8080"]
    depends_on: [rabbit]